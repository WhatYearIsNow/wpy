[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wpy-sitewide"
version = "0.1.0"
description = "基于 SQLite 的微北洋青年湖底论坛采集与看板"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "build==1.3.0",
    "ruff==0.14.14",
]

[project.urls]
Repository = "https://github.com/WhatYearIsNow/wpy"
Issues = "https://github.com/WhatYearIsNow/wpy/issues"

[project.scripts]
wpy = "wpy.cli:main"

[tool.setuptools.packages.find]
include = ["wpy", "wpy.*"]

[tool.setuptools.package-data]
"wpy.ui_templates" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.14.14"
target-version = "py310"
line-length = 100
include = ["wpy/**/*.py", "tests/**/*.py", "scripts/**/*.py", "tools/**/*.py", "ask.py"]
force-exclude = true
# Existing uncommitted work is outside this mechanical-format batch.
extend-exclude = [
    "wpy/ai_agent.py", "wpy/ai_agent_cli.py", "wpy/ai_agent_mail.py",
    "tests/test_ai_agent.py",
]

[tool.ruff.lint]
# Start with syntax errors. Do not reorder imports or change existing error handling.
select = ["E9"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
